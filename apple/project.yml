# XcodeGen spec (CI runs `xcodegen generate`; the .xcodeproj is not committed).
# One Swift codebase, two apps: Cellovision for iPhone/iPad and Cellovision for Apple TV.
name: Cellovision
options:
  bundleIdPrefix: com.cellovision
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  CellovisionPhone:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
    settings:
      base:
        PRODUCT_NAME: Cellovision
        PRODUCT_BUNDLE_IDENTIFIER: com.cellovision.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Cellovision
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        # Cindy (Settings > Cindy): talking to her, scanning the PC's pairing code
        NSMicrophoneUsageDescription: Talk to Cindy, your assistant on your PC, when you tap her mic.
        NSCameraUsageDescription: Scan the pairing code Cindy shows on your PC.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Cellovision looks for your Cellovision server on this Wi-Fi, and reaches Cindy on your PC.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
  CellovisionTV:
    type: application
    platform: tvOS
    sources:
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: Cellovision
        PRODUCT_BUNDLE_IDENTIFIER: com.cellovision.tv
        TARGETED_DEVICE_FAMILY: "3"
    info:
      path: tvOS/Info.plist
      properties:
        CFBundleDisplayName: Cellovision
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        NSLocalNetworkUsageDescription: Cellovision looks for your Cellovision server on this Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
